[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-automation-empire"
version = "1.0.0"
description = "The Ultimate Web Scraping & Automation Platform - AI-powered system for finding opportunities and automating outreach"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["automation", "scraping", "ai", "web-scraping", "freelance", "opportunities", "playwright", "fastapi"]
authors = [
    {name = "Mohamed Salem", email = "me@mohamed-salem.com"}
]
maintainers = [
    {name = "Mohamed Salem", email = "me@mohamed-salem.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
    "Framework :: FastAPI",
    "Framework :: Celery",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "playwright>=1.41.2",
    "selenium>=4.17.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "requests>=2.31.0",
    "httpx>=0.26.0",
    "fake-useragent>=1.4.0",
    "openai>=1.10.0",
    "anthropic>=0.18.1",
    "groq>=0.4.2",
    "langchain>=0.1.4",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",
    "twilio>=8.12.0",
    "sendgrid>=6.11.0",
    "loguru>=0.7.2",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

ai = [
    "sentence-transformers>=2.3.1",
    "spacy>=3.7.2",
    "nltk>=3.8.1",
    "together>=1.0.2",
    "langchain-openai>=0.0.5",
]

monitoring = [
    "flower>=2.0.1",
    "sentry-sdk>=1.40.0",
    "prometheus-client>=0.19.0",
]

captcha = [
    "2captcha-python>=1.2.0",
    "anticaptchaofficial>=1.0.56",
]

payment = [
    "stripe>=8.2.0",
]

all = [
    "ai-automation-empire[dev,ai,monitoring,captcha,payment]",
]

[project.urls]
Homepage = "https://github.com/profmohamed/AI-Automation-Empire"
Documentation = "https://github.com/profmohamed/AI-Automation-Empire/blob/main/README.md"
Repository = "https://github.com/profmohamed/AI-Automation-Empire"
"Bug Tracker" = "https://github.com/profmohamed/AI-Automation-Empire/issues"
Changelog = "https://github.com/profmohamed/AI-Automation-Empire/blob/main/CHANGELOG.md"
"Author Website" = "https://mohamed-salem.com"

[project.scripts]
ai-empire = "app.cli:main"
ai-empire-worker = "app.workers.celery_app:main"
ai-empire-api = "app.main:start"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
app = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=html --cov-report=term"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
